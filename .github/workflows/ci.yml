name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      # PyVista/VTK's off-screen renderer still needs a real OpenGL context -- ubuntu-latest's
      # base image has neither a GPU nor Mesa's software (llvmpipe) OpenGL driver installed, so
      # vtkRenderingOpenGL2 segfaults on first render() without these (issue #58: the stock-wheel,
      # "no Xvfb/OSMesa build needed" research claim didn't hold up against this actual runner).
      # xvfb-run below wraps both test steps in a virtual X server so vtkRenderingOpenGL2 has a
      # display to attach to.
      - name: Install headless rendering system packages (PyVista/VTK off-screen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglx-mesa0 libxrender1 libxext6 xvfb

      - name: Lint
        run: uvx ruff check .

      - name: Test (fast)
        run: xvfb-run -a uv run pytest

      - name: Determine slow-test scope
        id: scope
        run: .github/scripts/slow_test_scope.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

      - name: Test (slow)
        run: xvfb-run -a uv run pytest -m 'slow and not gpu' ${{ steps.scope.outputs.paths }}
