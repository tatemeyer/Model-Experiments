[project]
name = "jepa"
version = "0.1.0"
description = "Joint-Embedding Predictive Architecture research — latent-space self-supervised world-model mechanisms, at toy scale"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "mx-viz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa"]

[tool.uv.sources]
mx-viz = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]
