[project]
name = "mx-viz"
version = "0.1.0"
description = "Repo-wide plotting toolkit for visualizing research experiments and results"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8", "numpy>=2.5.2"]

[project.optional-dependencies]
# field-visualization Arc, Slice 1 (issue #58): PyVista + Plotly, together -- both are needed by
# near-term Slices (field-render-core, plotly-interactive) and no reason was found to split them.
# Optional: only reachable in CI via `uv sync --all-extras` (ci.yml), never part of the default
# `uv sync --all-packages` footprint any other workspace member picks up transitively.
# trame/trame-vtk/trame-vuetify (issue #62): PyVista's Plotter.export_html imports trame_vtk and
# (transitively, via pyvista.trame.jupyter) trame.widgets.vuetify at call time, raising ImportError
# without either -- required for the self-contained-HTML export path, not just jupyter-notebook
# embedding, so pulled in directly rather than via the heavier `pyvista[jupyter]` extra (which also
# drags in ipywidgets and friends this repo has no other use for).
# kaleido (issue #63): Plotly's static-image export backend, pinned to 0.2.1 -- 1.0+ requires a
# separately-installed system Chrome via `choreographer`; 0.2.1's bundled Chromium is closer in
# spirit to PyVista/VTK's self-contained off-screen renderer and is the CI-proven default.
3d = [
    "pyvista>=0.45",
    "plotly>=5.24",
    "trame>=3",
    "trame-vtk>=2",
    "trame-vuetify>=2",
    "nest-asyncio2>=1.7.2",
    "imageio>=2.34",
    "kaleido==0.2.1",
]

[project.scripts]
mx-viz = "mx_viz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mx_viz"]

[dependency-groups]
dev = ["pytest>=8"]
