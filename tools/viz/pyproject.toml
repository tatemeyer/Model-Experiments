[project]
name = "mx-viz"
version = "0.1.0"
description = "Repo-wide plotting toolkit for visualizing research experiments and results"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
mx-viz = "mx_viz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mx_viz"]

[dependency-groups]
dev = ["pytest>=8"]
